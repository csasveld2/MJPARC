[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parc"
version = "0.1.0"
description = "PARC: Physics-based Augmentation with Reinforcement Learning for Character Controllers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PARC Team" }
]
keywords = ["reinforcement-learning", "motion-tracking", "physics-simulation", "character-animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gym[accept-rom-license]>=0.26.2",
    "matplotlib",
    "numpy>=1.24.0",
    "pyyaml",
    "torch>=2.2.0",
    "wandb>=0.17.4",
    "trimesh",
    "polyscope",
    "send2trash",
    "py-cpuinfo",
    "imageio[ffmpeg]",
    "scipy",
]

[project.optional-dependencies]
# mjlab backend (MuJoCo Warp) - GPU required for training
mjlab = [
    "mjlab>=0.1.0",
    # mujoco-warp is pulled in by mjlab, but can specify explicitly:
    # "mujoco-warp @ git+https://github.com/google-deepmind/mujoco_warp",
]

# Isaac Gym backend (original) - requires manual installation
# isaacgym = []  # Isaac Gym must be installed manually from NVIDIA

# macOS specific (evaluation only, no GPU training)
macos = [
    "rtree",  # instead of embreex which has issues on macOS
]

# Linux/CUDA specific
linux = [
    "embreex",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit",
]

# All optional dependencies (except platform-specific)
all = [
    "parc[mjlab,dev]",
]

[project.scripts]
run-motionscope = "scripts.run_motionscope:main"
parc-train = "scripts.train:main"
parc-eval = "scripts.eval:main"

[project.urls]
Homepage = "https://github.com/mshoe/PARC"
Repository = "https://github.com/mshoe/PARC"
Documentation = "https://github.com/mshoe/PARC#readme"

[tool.hatch.build.targets.wheel]
packages = ["PARC"]

[tool.hatch.build.targets.sdist]
include = [
    "/PARC",
    "/data",
    "/scripts",
]

# ============================================================================
# uv configuration
# ============================================================================

[tool.uv]
# Default Python version
python = "3.11"

# Development dependencies (installed with `uv sync --dev`)
dev-dependencies = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit",
]

[tool.uv.sources]
# mjlab from GitHub (uncomment when using mjlab backend)
# mjlab = { git = "https://github.com/mujocolab/mjlab" }

# ============================================================================
# Tool configurations
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["parc", "PARC"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
